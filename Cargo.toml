[package]
name = "fastplay-client"
version = "0.1.0"
edition = "2021"
description = "Browser/PWA client for the fastPlay 4-player dominoes server"

[dependencies]
yew = { version = "0.23", features = ["csr"] }
gloo-net = { version = "0.7", features = ["websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-storage = "0.3"
gloo-console = "0.4"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Navigator",
    "UrlSearchParams",
    "HtmlInputElement",
    "Clipboard",
    "History",
    "ShareData",
    "Element",
] }
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "s"
lto = true
