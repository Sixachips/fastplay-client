name: Release

# Publishes a production bundle as a GitHub Release when a version tag
# (for example v0.2.0) is pushed. Deployment to the reverse proxy is not
# handled here; download the tarball from the release and unpack it there.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Verify tests pass
        run: |
          cargo test
          cargo check --target wasm32-unknown-unknown

      - name: Build production bundle
        run: trunk build --release

      - name: Package bundle
        run: |
          tar -C dist -czf fastplay-client-${GITHUB_REF_NAME}.tar.gz .
          sha256sum fastplay-client-${GITHUB_REF_NAME}.tar.gz > fastplay-client-${GITHUB_REF_NAME}.tar.gz.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            fastplay-client-${GITHUB_REF_NAME}.tar.gz \
            fastplay-client-${GITHUB_REF_NAME}.tar.gz.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
