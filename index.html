<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>fastPlay — dominoes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3d2e" />
    <link data-trunk rel="rust" />
    <link data-trunk rel="css" href="styles.css" />
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link data-trunk rel="copy-dir" href="icons" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/favicon.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
</head>
<body>
    <noscript>fastPlay needs JavaScript (it runs a WebAssembly app).</noscript>
    <script>
        // Register the service worker so the app is installable on phones.
        // Only runs on secure contexts (https/localhost) — harmless elsewhere.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
